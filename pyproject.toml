[project]
name = "centinela"
version = "0.1.0"
description = "Agente de voz para seguimiento postoperatorio con decision clinica determinista"
requires-python = ">=3.11"

# Criterio de seleccion de dependencias: todo lo que corre en el pipeline de voz
# usa ONNX Runtime, no PyTorch. No es purismo, es la compuerta G2 del reto: torch
# suma ~2.5 GB a la imagen y el jurado tiene 15 minutos para levantar la solucion.
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
    # --- RAG ---
    "chromadb==0.6.3",
    "fastembed==0.5.1",          # embeddings via ONNX, sin torch
    "rank-bm25==0.2.2",          # mitad lexica de la recuperacion hibrida
    "pypdf==5.1.0",
    "rapidocr-onnxruntime==1.4.4",  # OCR del PDF escaneado, sin tesseract del sistema
    # --- voz ---
    "faster-whisper==1.1.1",     # CTranslate2; trae Silero VAD integrado
    # TTS: piper se usa como binario externo, no como wheel de Python.
    # piper-tts no publica wheel para win_amd64 (piper-phonemize solo trae
    # manylinux y macos), asi que scripts/fetch_piper.py baja el binario
    # nativo de la plataforma y lo invocamos por subproceso. Mismo contrato
    # en Windows y en el contenedor Linux.
    # --- datos ---
    "numpy==2.2.1",
    "pandas==2.2.3",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "ruff==0.9.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api/centinela"]

[tool.pytest.ini_options]
pythonpath = ["api", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
